name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies (Server Solution)
        run: dotnet restore HonourSelfCheckoutServer/HonourSelfCheckoutServer.sln

      - name: Build Server Solution
        run: dotnet build HonourSelfCheckoutServer/HonourSelfCheckoutServer.sln --no-restore --configuration Release

      - name: Run Integration Tests
        id: test
        continue-on-error: true
        run: |
          # Create folder for test results
          mkdir -p test-results
          # Run tests with TRX logger; output file in the test-results folder
          dotnet test SelfCheckoutServer.Tests/SelfCheckoutServer.Tests.csproj --no-build --configuration Release --verbosity detailed --logger "trx;LogFileName=./test-results/test_results.trx"

      - name: List test-results directory
        run: ls -la test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/test_results.trx

      - name: Fail if tests failed
        if: steps.test.outcome != 'success'
        run: exit 1
