name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies (Server Solution)
        run: dotnet restore HonourSelfCheckoutServer/HonourSelfCheckoutServer.sln

      - name: Build Server Solution
        run: dotnet build HonourSelfCheckoutServer/HonourSelfCheckoutServer.sln --no-restore --configuration Release

      - name: Run Integration Tests
        id: test
        continue-on-error: true
        run: |
          # Run tests with TRX logger (default file name)
          dotnet test SelfCheckoutServer.Tests/SelfCheckoutServer.Tests.csproj --no-build --configuration Release --verbosity detailed --logger "trx"

      - name: Find and Move TRX File
        run: |
          mkdir -p test-results
          # Search for the TRX file (look in current directory and one level deep)
          trx_file=$(find . -maxdepth 2 -type f -name "*.trx" | head -n 1)
          echo "Found TRX file: $trx_file"
          if [ -n "$trx_file" ]; then
              mv "$trx_file" test-results/test_results.trx
          else
              echo "No TRX file found!"
          fi
          ls -la test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/test_results.trx

      - name: Fail if tests failed
        if: steps.test.outcome != 'success'
        run: exit 1
