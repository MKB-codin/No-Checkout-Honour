name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies (Server Solution)
        run: dotnet restore HonourSelfCheckoutServer/HonourSelfCheckoutServer.sln

      - name: Build Server Solution
        run: dotnet build HonourSelfCheckoutServer/HonourSelfCheckoutServer.sln --no-restore --configuration Release

      - name: Run integration tests
        run: dotnet test SelfCheckoutServer.Tests/SelfCheckoutServer.Tests.csproj --no-build --verbosity normal
